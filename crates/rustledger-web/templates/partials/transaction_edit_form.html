<div class="relative bg-white rounded-xl shadow-xl dark:bg-gray-800 max-w-3xl w-full">
    <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center gap-3">
            <div class="bg-blue-100 dark:bg-blue-900/30 rounded-full p-2">
                <svg class="h-5 w-5 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </div>
            <div>
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Edit Transaction</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">Update transaction details</p>
            </div>
        </div>
        <button type="button" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-full p-1 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" onclick="document.getElementById('edit-modal').close()">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    
    <div class="p-6 max-h-[70vh] overflow-y-auto">
        <form id="edit-txn-form" hx-post="/api/transactions/update" hx-swap="outerHTML" class="space-y-6">
            <input type="hidden" name="original_offset" value="{{ original_offset }}">
            <input type="hidden" name="original_length" value="{{ original_length }}">
            <input type="hidden" name="original_source_path" value="{{ original_source_path }}">
            
            <!-- Date and Status Row -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label for="edit-date" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        Date <span class="text-red-500">*</span>
                    </label>
                    <input type="date" name="date" id="edit-date" value="{{ date }}" required 
                           class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2.5 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Status</label>
                    <div class="flex items-center h-10">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="edit-cleared-toggle" class="sr-only peer" {% if cleared %}checked{% endif %}>
                            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-green-500"></div>
                            <span class="ml-3 text-sm font-medium text-gray-700 dark:text-gray-300">Cleared</span>
                        </label>
                        <input type="hidden" name="cleared" id="edit-cleared-input" value="{% if cleared %}on{% endif %}">
                    </div>
                </div>
            </div>

            <!-- Payee -->
            <div>
                <label for="edit-payee" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    Payee <span class="text-gray-400 font-normal">(optional)</span>
                </label>
                <input type="text" list="payees-list" name="payee" id="edit-payee" value="{{ payee }}" placeholder="e.g. Supermarket"
                       class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2.5 border">
            </div>

            <!-- Narration -->
            <div>
                <label for="edit-narration" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    Narration <span class="text-red-500">*</span>
                </label>
                <input type="text" name="narration" id="edit-narration" value="{{ narration }}" required placeholder="Description of the transaction"
                       class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2.5 border">
            </div>

            <!-- Postings Section -->
            <div class="border-t border-gray-200 dark:border-gray-700 pt-5">
                <div class="flex items-center justify-between mb-4">
                    <h4 class="text-lg font-medium text-gray-900 dark:text-white">Postings</h4>
                    <button type="button" onclick="addEditPosting()" 
                            class="inline-flex items-center px-3 py-1.5 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600 transition-colors">
                        <svg class="-ml-0.5 mr-1.5 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Add Posting
                    </button>
                </div>
                
                <div id="edit-postings-container" class="space-y-3">
                    <!-- Posting 1 -->
                    <div class="edit-posting-row flex flex-col sm:flex-row items-start gap-3 p-4 bg-gray-50 dark:bg-gray-750 rounded-lg border-l-4 border-blue-500">
                        <div class="flex-1 w-full">
                            <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Account <span class="text-red-500">*</span></label>
                            <input type="text" name="account_1" value="{{ account_1 }}" required list="accounts-list"
                                   class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2 border">
                        </div>
                        <div class="w-full sm:w-48">
                            <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Amount</label>
                            <input type="text" name="amount_1" value="{{ amount_1 }}" placeholder="-50.00 USD"
                                   class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2 border font-mono">
                        </div>
                        <button type="button" onclick="removeEditPosting(this)" class="mt-5 sm:mt-0 p-2 text-gray-400 hover:text-red-500 transition-colors hidden remove-posting-btn">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>

                    <!-- Posting 2 -->
                    <div class="edit-posting-row flex flex-col sm:flex-row items-start gap-3 p-4 bg-gray-50 dark:bg-gray-750 rounded-lg border-l-4 border-green-500">
                        <div class="flex-1 w-full">
                            <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Account</label>
                            <input type="text" name="account_2" value="{{ account_2 }}" list="accounts-list"
                                   class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2 border">
                        </div>
                        <div class="w-full sm:w-48">
                            <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Amount</label>
                            <input type="text" name="amount_2" value="{{ amount_2 }}" placeholder="50.00 USD"
                                   class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2 border font-mono">
                        </div>
                        <button type="button" onclick="removeEditPosting(this)" class="mt-5 sm:mt-0 p-2 text-gray-400 hover:text-red-500 transition-colors hidden remove-posting-btn">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <datalist id="accounts-list">
                    {% for account in accounts %}
                    <option value="{{ account }}">
                    {% endfor %}
                </datalist>
                <datalist id="payees-list">
                    {% for p in payees %}
                    <option value="{{ p }}">
                    {% endfor %}
                </datalist>
            </div>

            <!-- Preview -->
            <div class="border-t border-gray-200 dark:border-gray-700 pt-5">
                <h4 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Preview</h4>
                <pre id="edit-txn-preview" class="bg-gray-900 text-green-400 p-4 rounded-lg text-sm font-mono overflow-x-auto"></pre>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <button type="button" onclick="document.getElementById('edit-modal').close()" 
                        class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 bg-white hover:bg-gray-50 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600 transition-colors">
                    Cancel
                </button>
                <button type="submit" 
                        class="inline-flex justify-center items-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                    <svg class="-ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Update Transaction
                </button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    let editPostingCount = 2;
    
    // Initialize cleared checkbox sync
    const clearedToggle = document.getElementById('edit-cleared-toggle');
    const clearedInput = document.getElementById('edit-cleared-input');
    if (clearedToggle && clearedInput) {
        clearedToggle.addEventListener('change', function() {
            clearedInput.value = this.checked ? 'on' : '';
            updateEditPreview();
        });
    }
    
    // Add new posting row
    window.addEditPosting = function() {
        editPostingCount++;
        const container = document.getElementById('edit-postings-container');
        const colors = ['border-purple-500', 'border-orange-500', 'border-pink-500', 'border-cyan-500', 'border-yellow-500', 'border-indigo-500'];
        const color = colors[(editPostingCount - 3) % colors.length];
        
        const row = document.createElement('div');
        row.className = `edit-posting-row flex flex-col sm:flex-row items-start gap-3 p-4 bg-gray-50 dark:bg-gray-750 rounded-lg border-l-4 ${color}`;
        row.innerHTML = `
            <div class="flex-1 w-full">
                <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Account</label>
                <input type="text" name="account_${editPostingCount}" list="accounts-list"
                       class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2 border">
            </div>
            <div class="w-full sm:w-48">
                <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Amount</label>
                <input type="text" name="amount_${editPostingCount}" placeholder="Amount"
                       class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white p-2 border font-mono">
            </div>
            <button type="button" onclick="removeEditPosting(this)" class="mt-5 sm:mt-0 p-2 text-gray-400 hover:text-red-500 transition-colors remove-posting-btn">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
        `;
        container.appendChild(row);
        
        // Add event listeners for preview
        row.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', updateEditPreview);
        });
        
        updateRemoveButtons();
        updateEditPreview();
    };
    
    // Remove posting row
    window.removeEditPosting = function(btn) {
        const row = btn.closest('.edit-posting-row');
        if (row) {
            row.remove();
            updateRemoveButtons();
            updateEditPreview();
        }
    };
    
    // Update visibility of remove buttons
    function updateRemoveButtons() {
        const rows = document.querySelectorAll('.edit-posting-row');
        const removeBtns = document.querySelectorAll('.remove-posting-btn');
        removeBtns.forEach((btn, index) => {
            if (rows.length <= 2) {
                btn.classList.add('hidden');
            } else {
                btn.classList.remove('hidden');
            }
        });
    }
    
    // Update preview
    function updateEditPreview() {
        const date = document.getElementById('edit-date')?.value || 'YYYY-MM-DD';
        const payee = document.getElementById('edit-payee')?.value || '';
        const narration = document.getElementById('edit-narration')?.value || 'Description';
        const cleared = document.getElementById('edit-cleared-toggle')?.checked;
        const flag = cleared ? '*' : '!';
        
        let preview = `${date} ${flag}`;
        if (payee) {
            preview += ` "${payee}"`;
        }
        preview += ` "${narration}"\n`;
        
        // Get all posting rows
        const rows = document.querySelectorAll('.edit-posting-row');
        rows.forEach((row) => {
            const accountInput = row.querySelector('input[name^="account"]');
            const amountInput = row.querySelector('input[name^="amount"]');
            const account = accountInput?.value || '';
            const amount = amountInput?.value || '';
            if (account) {
                preview += `  ${account}`;
                if (amount) {
                    preview += ` ${amount}`;
                }
                preview += '\n';
            }
        });
        
        const previewEl = document.getElementById('edit-txn-preview');
        if (previewEl) {
            previewEl.textContent = preview;
        }
    }
    
    // Initialize
    updateRemoveButtons();
    updateEditPreview();
    
    // Add event listeners
    document.querySelectorAll('#edit-txn-form input').forEach(input => {
        input.addEventListener('input', updateEditPreview);
    });
    
    // Handle form submission
    document.getElementById('edit-txn-form').addEventListener('htmx:afterRequest', (event) => {
        if (event.detail.successful) {
            document.getElementById('edit-modal').close();
            // Reload the page to show updated transaction
            window.location.reload();
        }
    });
})();
</script>
