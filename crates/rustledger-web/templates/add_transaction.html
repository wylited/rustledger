{% extends "base.html" %}

{% block title %}Add Transaction - Rustledger{% endblock title %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Add Transaction</h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Create a new transaction in your ledger</p>
</div>

{% include "partials/transaction_form.html" %}

<!-- Toast Container -->
<div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

<script>
function showToast(message, type) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg mb-2 flex items-center gap-2 animate-toast';
    toast.innerHTML = '<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg><span>' + message + '</span>';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
{% endblock content %}
